name: Validate Master PR

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source-branch:
    name: Verify PR Originates from dev
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Source Branch
        shell: bash
        run: |
          echo "Target branch (base_ref): ${{ github.base_ref }}"
          echo "Source branch (head_ref): ${{ github.head_ref }}"
          echo "Source repository: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "Target repository: ${{ github.repository }}"

          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Pull Requests to 'master' are strictly permitted from the 'dev' branch only. Detected source branch: '${{ github.head_ref }}'."
            exit 1
          fi

          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::Pull Requests to 'master' must originate from within the '${{ github.repository }}' repository."
            exit 1
          fi

          echo "Validation succeeded: Pull Request originates from 'dev'."
