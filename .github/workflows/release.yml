name: Android Release Build & Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production
      rollout_fraction:
        description: 'Rollout fraction for production (e.g. 0.1 for 10%, 1.0 for 100%). Ignored for internal track.'
        required: false
        default: '1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Create .env File
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "I_BASE_URL=${{ secrets.I_BASE_URL }}" >> .env
          echo "IS_MOCK=${{ secrets.IS_MOCK }}" >> .env
          echo "QH_USER_INFO=${{ secrets.QH_USER_INFO }}" >> .env
          echo "QH_STORY_LIST=${{ secrets.QH_STORY_LIST }}" >> .env
          echo "QH_USER_STORY=${{ secrets.QH_USER_STORY }}" >> .env
          echo "QH_HIGHLIGHT_LIST=${{ secrets.QH_HIGHLIGHT_LIST }}" >> .env
          echo "QH_HIGHLIGHT_STORY=${{ secrets.QH_HIGHLIGHT_STORY }}" >> .env
          echo "FIREBASE_BASE64=${{ secrets.FIREBASE_BASE64 }}" >> .env
          echo "ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_APP_OPEN_AD_ID=${{ secrets.ADMOB_APP_OPEN_AD_ID }}" >> .env
          echo "ADMOB_INTERSTITIAL_AD_ID=${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}" >> .env
          echo "ADMOB_REWARDED_INTERSTITIAL_AD_ID=${{ secrets.ADMOB_REWARDED_INTERSTITIAL_AD_ID }}" >> .env
          echo "FAN_REWARDED_INTERSTITIAL_AD_ID=${{ secrets.FAN_REWARDED_INTERSTITIAL_AD_ID }}" >> .env

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release Bundle (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Sign Release AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storyghost-release-aab
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: error

      - name: Upload Proguard Mapping File
        uses: actions/upload-artifact@v4
        with:
          name: storyghost-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Deploy to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: in.vinit.storyghost
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          track: ${{ github.event.inputs.track || 'internal' }}
          userFraction: ${{ github.event.inputs.track == 'production' && github.event.inputs.rollout_fraction || '1.0' }}
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt
