name: Android Release (Internal Track & GitHub Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx4096m -Dfile.encoding=UTF-8"
      BUILD_TOOLS_VERSION: "35.0.0"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Create .env File
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> .env
          echo "I_BASE_URL=${{ secrets.I_BASE_URL }}" >> .env
          echo "IS_MOCK=${{ secrets.IS_MOCK }}" >> .env
          echo "QH_USER_INFO=${{ secrets.QH_USER_INFO }}" >> .env
          echo "QH_STORY_LIST=${{ secrets.QH_STORY_LIST }}" >> .env
          echo "QH_USER_STORY=${{ secrets.QH_USER_STORY }}" >> .env
          echo "QH_HIGHLIGHT_LIST=${{ secrets.QH_HIGHLIGHT_LIST }}" >> .env
          echo "QH_HIGHLIGHT_STORY=${{ secrets.QH_HIGHLIGHT_STORY }}" >> .env
          echo "FIREBASE_BASE64=${{ secrets.FIREBASE_BASE64 }}" >> .env
          echo "ONESIGNAL_APP_ID=${{ secrets.ONESIGNAL_APP_ID }}" >> .env
          echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> .env
          echo "ADMOB_APP_OPEN_AD_ID=${{ secrets.ADMOB_APP_OPEN_AD_ID }}" >> .env
          echo "ADMOB_INTERSTITIAL_AD_ID=${{ secrets.ADMOB_INTERSTITIAL_AD_ID }}" >> .env
          echo "ADMOB_REWARDED_INTERSTITIAL_AD_ID=${{ secrets.ADMOB_REWARDED_INTERSTITIAL_AD_ID }}" >> .env
          echo "FAN_REWARDED_INTERSTITIAL_AD_ID=${{ secrets.FAN_REWARDED_INTERSTITIAL_AD_ID }}" >> .env

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Detect Android Build Tools Version
        run: |
          BUILD_TOOLS_PATH="/usr/local/lib/android/sdk/build-tools"
          if [ -d "$BUILD_TOOLS_PATH" ]; then
            DETECTED_VERSION=$(ls -1 "$BUILD_TOOLS_PATH" | sort -V | tail -n 1)
            echo "Detected Android Build-Tools version: $DETECTED_VERSION"
            echo "BUILD_TOOLS_VERSION=$DETECTED_VERSION" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release Bundle (AAB)
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign Release AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_aab
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOLS_VERSION }}

      - name: Upload Signed AAB as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storyghost-release-aab
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          if-no-files-found: error

      - name: Upload Signed APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: storyghost-release-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
          if-no-files-found: error

      - name: Deploy to Google Play Console (Internal Track Only)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.vinit.storyghost
          releaseFiles: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          track: internal
          status: draft
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: |
            ${{ steps.sign_aab.outputs.signedReleaseFile }}
            ${{ steps.sign_apk.outputs.signedReleaseFile }}
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
